<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ec8a9a" />
    <!-- Installable to a phone's home screen. Manifest and icons only: there is
         no service worker, so this is a launcher rather than offline support. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Taskrr" />
    <!-- A real PNG: iOS draws nothing for an SVG here, and falls back to a
         screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Taskrr — 轻量自托管的事项间隔追踪工具，记录你上一次做某件事是什么时候。"
    />
    <title>Taskrr</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
